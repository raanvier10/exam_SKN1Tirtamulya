name: Automated Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Memulai proses deploy otomatis..."
            cd /var/www/exam_SKN1Tirtamulya
            
            # 1. Tarik perubahan terbaru dari GitHub
            git reset --hard HEAD
            git pull origin main
            
            # 2. Masuk ke folder backend Laravel
            cd exambro-backend
            
            # 3. Install & optimasi dependensi Composer (tanpa dev package)
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # 4. Jalankan migrasi database jika ada struktur tabel baru
            php artisan migrate --force
            
            # 5. Refresh cache konfigurasi, route, dan view untuk kecepatan maksimal
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 6. Pastikan izin akses folder storage tetap aman
            chown -R www-data:www-data storage bootstrap/cache public/downloads
            chmod -R 775 storage bootstrap/cache
            
            # 7. Reload service PHP-FPM dan Nginx
            systemctl reload php8.3-fpm || systemctl reload php8.2-fpm
            systemctl reload nginx
            
            echo "✅ [CI/CD] Deploy berhasil! Sistem di VPS sudah update ke versi terbaru."
